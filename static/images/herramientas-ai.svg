<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0a0a0a"/>
      <stop offset="100%" style="stop-color:#1a1a1a"/>
    </linearGradient>
    <linearGradient id="glow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#22c55e;stop-opacity:0.3"/>
      <stop offset="100%" style="stop-color:#22c55e;stop-opacity:0"/>
    </linearGradient>
  </defs>
  <rect width="800" height="400" fill="url(#bg)"/>
  <rect x="0" y="180" width="800" height="40" fill="url(#glow)" opacity="0.3"/>
  <!-- AI Brain icon -->
  <circle cx="400" cy="160" r="60" fill="none" stroke="#22c55e" stroke-width="2" opacity="0.6"/>
  <circle cx="400" cy="160" r="40" fill="none" stroke="#22c55e" stroke-width="1.5" opacity="0.4"/>
  <circle cx="400" cy="160" r="8" fill="#22c55e" opacity="0.8"/>
  <!-- Neural connections -->
  <line x1="360" y1="140" x2="340" y2="120" stroke="#22c55e" stroke-width="1" opacity="0.4"/>
  <line x1="440" y1="140" x2="460" y2="120" stroke="#22c55e" stroke-width="1" opacity="0.4"/>
  <line x1="360" y1="180" x2="340" y2="200" stroke="#22c55e" stroke-width="1" opacity="0.4"/>
  <line x1="440" y1="180" x2="460" y2="200" stroke="#22c55e" stroke-width="1" opacity="0.4"/>
  <circle cx="340" cy="120" r="4" fill="#22c55e" opacity="0.5"/>
  <circle cx="460" cy="120" r="4" fill="#22c55e" opacity="0.5"/>
  <circle cx="340" cy="200" r="4" fill="#22c55e" opacity="0.5"/>
  <circle cx="460" cy="200" r="4" fill="#22c55e" opacity="0.5"/>
  <!-- Title -->
  <text x="400" y="280" text-anchor="middle" fill="#fafafa" font-family="system-ui, sans-serif" font-size="28" font-weight="700">5 Herramientas AI</text>
  <text x="400" y="315" text-anchor="middle" fill="#737373" font-family="system-ui, sans-serif" font-size="16">para Productividad 2026</text>
</svg>
