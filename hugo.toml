baseURL = 'https://adrizola7.github.io/herramientasdigitales/'
locale = 'es'
title = 'Soft Kuro Technology'
theme = 'PaperMod'
paginate = 10

[params]
  env = 'production'
  description = 'Reseñas honestas y comparativas de las mejores herramientas digitales, software SaaS y apps de productividad para potenciar tu trabajo.'
  author = 'Soft Kuro Technology'
  defaultTheme = 'dark'
  ShowShareButtons = false
  ShowReadingTime = true
  ShowPostNavLinks = true
  ShowBreadCrumbs = true
  ShowCodeCopyButtons = true
  ShowWordCount = true
  ShowRssButtonInSectionTermList = true
  UseHugoToc = true
  disableSpecial1stPost = false
  hidemeta = true
  hideSummary = false
  hideToc = false
  showtoc = true
  tocopen = true
  comments = false
  dateFormat = '2 de enero, 2006'
  images = ['logo.png']
  ShowSearch = true

  [params.homeInfoParams]
    Title = 'Soft Kuro Technology'
    Content = 'Reseñas honestas y comparativas de las mejores herramientas digitales, software SaaS y apps de productividad para potenciar tu trabajo.'

  [[params.socialIcons]]
    name = 'email'
    url = 'mailto:contacto@herramientasdigitales.net'

  [params.assets]
    disableFingerprinting = true
    favicon = '/favicon.svg'
    customCSS = ['/css/custom.css']

  [params.label]
    text = 'Soft Kuro Technology'
    icon = '/images/logo-softkuro.png'

  [params.cover]
    hidden = true
    hiddenInList = true
    hiddenInSingle = true

[menu]
  [[menu.main]]
    identifier = 'herramientas'
    name = 'Herramientas'
    url = '/herramientas/'
    weight = 10
  [[menu.main]]
    identifier = 'comparativas'
    name = 'Comparativas'
    url = '/comparativas/'
    weight = 20
  [[menu.main]]
    identifier = 'guias'
    name = 'Guías'
    url = '/guias/'
    weight = 30
  [[menu.main]]
    identifier = 'search'
    name = 'Buscar'
    url = '/search/'
    weight = 40
  [[menu.main]]
    identifier = 'about'
    name = 'Sobre nosotros'
    url = '/about/'
    weight = 50

[outputs]
  home = ['HTML', 'RSS', 'JSON']

[sitemap]
  changefreq = 'weekly'
  filename = 'sitemap.xml'
  priority = 0.5

[minify]
  disableCSS = false
  disableHTML = false
  disableJS = false
  disableSVG = false
  keepComments = false

[markup]
  [markup.goldmark]
    [markup.goldmark.renderer]
      unsafe = true
  [markup.highlight]
    codeFences = true
    guessSyntax = true
    lineNos = false
    noClasses = true
  [markup.tableOfContents]
    endLevel = 3
    ordered = false
    startLevel = 2
