[build]
  command = "hugo --minify"
  publish = "public"

[build.environment]
  HUGO_VERSION = "0.165.0"
  HUGO_ENVIRONMENT = "production"

[build.processing]
  skip_processing = false

[build.processing.css]
  bundle = true

[build.processing.js]
  bundle = true

[build.processing.html]
  pretty_urls = true

[build.processing.images]
  compress = true
